name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/animerch
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password-123
      # Base64-encoded test-only signing key; never used outside this disposable job.
      JWT_SECRET: Y2ktb25seS1qd3Qtc2lnbmluZy1rZXktbm90LWZvci1wcm9kdWN0aW9u
      JWT_EXPIRATION: '3600000'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: animerch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d animerch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run all tests
        run: bash ./mvnw -B -ntp verify

      - name: Summarize tests and verify database coverage
        if: always()
        run: python3 .github/scripts/check_test_reports.py

      - name: Preserve test reports and application logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            logs/
          retention-days: 14
          if-no-files-found: warn
